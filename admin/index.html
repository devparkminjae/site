<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>관리자 | 우리 사이트</title><link rel="stylesheet" href="admin.css?v=2"></head><body><main class="shell"><a href="../" class="back">← 사이트 보기</a><section id="login-card" class="card"><p class="label">ADMIN</p><h1>관리자 로그인</h1><p>등록된 관리자 계정으로 로그인하세요.</p><form id="login-form"><label>이메일<input id="email" type="email" required></label><label>비밀번호<input id="password" type="password" required></label><button>로그인</button></form><p id="login-message" class="message"></p></section><section id="editor" hidden><div class="editor-head"><div><p class="label">SINGLE FILE EDITOR</p><h1>홈페이지 업로드</h1></div><button id="logout" class="secondary">로그아웃</button></div><form id="content-form" class="card"><label>HTML 단일 파일 업로드<input id="html-file" type="file" accept=".html,.htm,text/html"><small>CSS와 JavaScript를 HTML 파일의 &lt;style&gt;, &lt;script&gt; 안에 넣으세요.</small></label><label>또는 코드 붙여넣기<textarea id="page_html" rows="18" spellcheck="false" placeholder="여기에 전체 HTML을 Ctrl+V 하세요."></textarea></label><button id="save">저장하고 공개하기</button><p id="save-message" class="message"></p></form></section></main><script src="../supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=2"></script></body></html>
