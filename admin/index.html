<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>관리자 | 우리 사이트</title><link rel="stylesheet" href="admin.css?v=3"></head><body><main class="shell"><a href="../" class="back">← 사이트 보기</a><section id="login-card" class="card"><p class="label">ADMIN</p><h1>관리자 로그인</h1><p>등록된 관리자 계정으로 로그인하세요.</p><form id="login-form"><label>이메일<input id="email" type="email" required></label><label>비밀번호<input id="password" type="password" required></label><button>로그인</button></form><p id="login-message" class="message"></p></section><section id="editor" hidden><div class="editor-head"><div><p class="label">MULTI SITE EDITOR</p><h1>사이트 관리</h1></div><button id="logout" class="secondary">로그아웃</button></div><section class="card site-picker"><label>편집할 사이트<select id="site-select"></select></label><a id="site-link" class="visit" target="_blank" rel="noopener">공개 사이트 열기 ↗</a><form id="create-form"><label>새 사이트 디렉터리 이름<input id="new-site-id" placeholder="예: event-2026" pattern="[a-z0-9-]+" required><small>영문 소문자, 숫자, 하이픈만 사용할 수 있습니다.</small></label><button>새 사이트 추가</button></form><p id="create-message" class="message"></p></section><form id="content-form" class="card"><label>HTML 단일 파일 업로드<input id="html-file" type="file" accept=".html,.htm,text/html"><small>CSS와 JavaScript를 HTML 파일의 &lt;style&gt;, &lt;script&gt; 안에 넣으세요.</small></label><label>또는 코드 붙여넣기<textarea id="page_html" rows="18" spellcheck="false" placeholder="여기에 전체 HTML을 Ctrl+V 하세요."></textarea></label><button id="save">저장하고 공개하기</button><p id="save-message" class="message"></p></form></section></main><script src="../supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=3"></script></body></html>
