<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>관리자 | 우리 사이트</title><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><a href="../" class="back">← 사이트 보기</a><section id="login-card" class="card"><p class="label">ADMIN</p><h1>관리자 로그인</h1><p>등록된 관리자 계정으로 로그인하세요.</p><form id="login-form"><label>이메일<input id="email" type="email" required></label><label>비밀번호<input id="password" type="password" required></label><button>로그인</button></form><p id="login-message" class="message"></p></section><section id="editor" hidden><div class="editor-head"><div><p class="label">CONTENT EDITOR</p><h1>홈페이지 편집</h1></div><button id="logout" class="secondary">로그아웃</button></div><form id="content-form" class="card"><label>제목<input id="title" required></label><label>설명<textarea id="description" rows="3"></textarea></label><div class="columns"><label>버튼 문구<input id="button_text"></label><label>버튼 링크<input id="button_url" placeholder="#about 또는 https://..."></label></div><label>본문<textarea id="body" rows="7"></textarea></label><label>대표 이미지<input id="image" type="file" accept="image/*"><small>선택하지 않으면 기존 이미지가 유지됩니다.</small></label><div id="preview-wrap" hidden><img id="preview" alt="현재 대표 이미지"></div><button id="save">저장하기</button><p id="save-message" class="message"></p></form></section></main><script src="../supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
